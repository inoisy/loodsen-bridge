# Мосты в рабочую сеть (bridge-mux, 27.10.2026): VPN на сервере не включаем.
# Каждый сотрудник держит ssh -N -R на порты своего слота 127.0.0.1:20000+100·N+K;
# постоянные порты (18443 и др.) слушает bridge-mux. Ключи — bridge-mux user add.
Match User bridge
    AllowTcpForwarding remote
    # clientspecified — для legacy-клиента на 192.168.200.1:18443; адреса всё равно режет permitlisten
    GatewayPorts clientspecified
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    PermitTunnel no
    # уснувшая машина освобождает слот за ~45 с
    ClientAliveInterval 15
    ClientAliveCountMax 3
