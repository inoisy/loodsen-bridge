# Мост в рабочую сеть через Мак владельца (17.10.2026): VPN на сервере не включаем.
# Мак держит ssh -N -R 127.0.0.1:18443 и 192.168.200.1:18443 → <sphere-host>:443.
Match User bridge
    AllowTcpForwarding remote
    GatewayPorts clientspecified
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    PermitTunnel no
